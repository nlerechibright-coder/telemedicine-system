{% extends 'management/base.html' %}
{% block management_content %}
<h2 class="mb-4">Create Doctor Account</h2>
<div class="card">
    <div class="card-body">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Initial Password</label>
                    <input type="password" name="password" class="form-control" required>
                    <small class="text-muted">Provide this securely to the doctor.</small>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Specialty</label>
                    <select name="specialty" class="form-select" required>
                        {% for s in specialties %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">License Number</label>
                    <input type="text" name="license_number" class="form-control" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Qualifications</label>
                <input type="text" name="qualifications" class="form-control" placeholder="e.g., MD, PhD" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Consultation Fee</label>
                <input type="number" step="0.01" name="consultation_fee" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Create Doctor Account</button>
            <a href="{% url 'management:doctor_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
